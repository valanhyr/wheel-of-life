<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rueda de la Vida — Galería de 21 temas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Nunito:wght@600;800&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;600;800&family=Space+Grotesk:wght@500;700&family=Lora:wght@500;700&family=Outfit:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Estructura común. Cada tema fija variables + 7 "interruptores" (data-*):
   layout (top|side|center|rail|split), wheel (sectors|radar|petals|rings|dots),
   opt (cards|list|pills|segmented|grid), head (bar|hero|centered), step (pill|line|dots),
   fx (glass|flat|float|soft|brut|line) y dark.
   ===================================================================== */
:root{--ok:#12805c;--warn:#b7791f;--bad:#c53030}
[data-dark="1"]{--ok:#4cc38a;--warn:#e0b24f;--bad:#f0706a}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);background-image:var(--bgimg,none);background-attachment:fixed;color:var(--ink);font:400 15px/1.55 var(--fb);transition:background-color .35s,color .3s;min-height:100dvh;padding-bottom:6rem}
button{font-family:inherit}
h1,h2,h3,h4,p,ol,ul{margin:0}ol,ul{padding:0;list-style:none}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;display:none}
[data-fx="glass"] .orbs{display:block}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--oo,.5);animation:fl 24s ease-in-out infinite}
.orb:nth-child(1){width:42rem;height:42rem;left:-12rem;top:-12rem;background:var(--o1)}
.orb:nth-child(2){width:36rem;height:36rem;right:-8rem;top:8rem;background:var(--o2);animation-delay:-8s}
.orb:nth-child(3){width:32rem;height:32rem;left:35%;bottom:-14rem;background:var(--o3);animation-delay:-15s}
@keyframes fl{50%{transform:translate(5rem,4rem) scale(1.1)}}

/* ---------- layouts ---------- */
.app{display:grid;gap:var(--gap,1.25rem);padding:clamp(.9rem,2.5vw,1.75rem);max-width:90rem;margin:auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "wheel" "stack"}
.head{grid-area:head}.wheelcol{grid-area:wheel}.stack{grid-area:stack}.side{grid-area:side;display:none}
@media(min-width:960px){
  [data-layout="top"] .app{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"head head" "wheel stack";align-items:start}
  [data-layout="side"] .app{max-width:96rem;grid-template-columns:15.5rem minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"side head head" "side wheel stack";align-items:start}
  [data-layout="side"] .side{display:block;position:sticky;top:1rem}
  [data-layout="center"] .app{max-width:50rem}
  [data-layout="rail"] .app{grid-template-columns:17rem minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"head wheel stack";align-items:start}
  [data-layout="rail"] .head{position:sticky;top:1.25rem}
  [data-layout="split"] .app{max-width:94rem;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"head stack" "wheel stack";align-items:start;column-gap:clamp(1.5rem,4vw,4rem)}
}

/* ---------- paneles según efecto ---------- */
.panel{background:var(--panel);border-radius:var(--r);padding:clamp(1rem,2.5vw,1.6rem);position:relative}
[data-fx="glass"] .panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);backdrop-filter:blur(var(--blur,20px)) saturate(1.6);-webkit-backdrop-filter:blur(var(--blur,20px)) saturate(1.6);box-shadow:var(--sh),inset 0 1px 0 var(--hi,#fff3)}
[data-fx="flat"] .panel{border:1px solid var(--line);box-shadow:var(--sh,none)}
[data-fx="float"] .panel{box-shadow:var(--sh);border:1px solid var(--line)}
[data-fx="soft"] .panel{background:var(--panel);box-shadow:9px 9px 22px var(--lo),-9px -9px 22px var(--hi)}
[data-fx="brut"] .panel{border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
[data-fx="line"] .panel{background:transparent;border:0;border-top:1px solid var(--ink);border-radius:0;padding-inline:0}
.inset{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rs)}
[data-fx="soft"] .inset{border:0;box-shadow:inset 3px 3px 8px var(--lo),inset -3px -3px 8px var(--hi)}
[data-fx="line"] .inset{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0}
[data-fx="brut"] .inset{border:2px solid var(--ink)}

/* ---------- cabecera (original: título, subtítulo, 4 acciones, nota) ---------- */
.head{display:flex;flex-direction:column;gap:.9rem}
.head__row{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
.title{font:var(--tw,700) clamp(1.6rem,4.4vw,2.5rem)/1.05 var(--fd);letter-spacing:var(--tl,-.03em);text-transform:var(--tt,none)}
[data-grad="1"] .title{background:linear-gradient(120deg,var(--ink),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:var(--muted);font-size:.82rem;margin-top:.35rem;letter-spacing:.14em;text-transform:uppercase}
.actions{display:flex;gap:.5rem;flex-wrap:wrap}
[data-head="hero"] .title{font-size:clamp(2.4rem,8vw,5rem);line-height:.95}
[data-head="hero"] .head__row{flex-direction:column;align-items:flex-start;gap:1.25rem}
[data-head="centered"] .head__row{flex-direction:column;text-align:center;gap:1.1rem}
[data-head="centered"] .actions,[data-head="centered"] .transfer{justify-content:center;text-align:center}
[data-layout="rail"] .head__row,[data-layout="split"] .head__row{flex-direction:column;align-items:flex-start}
[data-layout="rail"] .actions{flex-direction:column;align-items:stretch;width:100%}
.btn{cursor:pointer;font:600 .85rem var(--fb);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:var(--rb,999px);padding:.6rem 1.05rem;min-height:42px;transition:transform .18s,background .2s,border-color .2s,box-shadow .2s,color .2s}
.btn:hover{transform:translateY(-1px);border-color:var(--acc)}
.btn:active{transform:none}
.btn--primary{background:var(--accg,var(--acc));color:var(--accink);border-color:transparent}
.btn--primary:hover{filter:brightness(1.07);border-color:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
[data-fx="soft"] .btn{border:0;box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi);background:var(--panel)}
[data-fx="soft"] .btn:active{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
[data-fx="soft"] .btn--primary{background:var(--acc);box-shadow:5px 5px 12px var(--lo),-4px -4px 10px var(--hi)}
[data-fx="brut"] .btn{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
[data-fx="brut"] .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
[data-fx="line"] .btn{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding-inline:.1rem;min-height:36px}
[data-fx="line"] .btn:hover{border-color:var(--acc);color:var(--acc)}
[data-fx="line"] .btn--primary{background:var(--ink);color:var(--bg);border:0;padding-inline:1.2rem;border-radius:0}
[data-fx="line"] .btn--primary:hover{background:var(--acc);color:var(--accink)}
.btn:focus-visible,.scale__label:focus-visible,.area:focus-visible,.nav-i:focus-visible,.stepper__button:focus-visible,.section__toggle:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.transfer{color:var(--muted);font-size:.78rem;line-height:1.5;display:flex;flex-direction:column;gap:.25rem}
.transfer [role=status]:not(:empty){color:var(--ink)}

/* ---------- barra lateral (solo layout side) ---------- */
.side .panel{padding:1rem .7rem}
.side__brand{font:var(--tw,700) 1rem var(--fd);padding:.2rem .6rem .9rem}
.side__h{font:600 .66rem var(--fb);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:.3rem .6rem}
.nav-i{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:.5rem .6rem;border-radius:var(--rs);cursor:pointer;font:500 .88rem var(--fb);transition:background .15s}
.nav-i:hover{background:var(--panel2)}
.nav-i.on{background:var(--accsoft);color:var(--acc)}
.nav-i i{width:.55rem;height:.55rem;border-radius:50%;background:var(--c);flex:none}
.nav-i span{margin-left:auto;font:500 .78rem var(--fm);color:var(--muted)}

/* ---------- rueda ---------- */
.wheel{width:100%;max-width:34rem;display:block;margin:.25rem auto 0;overflow:visible}
[data-glow="1"] .wheel{filter:drop-shadow(0 16px 34px var(--glow))}
.ringline{fill:none;stroke:var(--line);stroke-width:.25}
.spoke{stroke:var(--line);stroke-width:.2}
.area{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,.9,.25,1.1) both;transition:opacity .2s,filter .2s}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.wheel:hover .area{opacity:.5}.wheel .area:hover,.wheel .area.sel{opacity:1;filter:brightness(1.08)}
.area.pending{opacity:.35}
.wheel .lbl{font:600 3px var(--fb);fill:var(--ink);pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.hub{fill:var(--bg);fill-opacity:.6;stroke:var(--line);stroke-width:.3}
.hubn{font:800 7px var(--fd);fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.hubs{font:600 2.2px var(--fb);fill:var(--muted);text-anchor:middle;text-transform:uppercase;letter-spacing:.2px}
.shape{fill:var(--acc);fill-opacity:.16;stroke:var(--acc);stroke-width:.7;stroke-linejoin:round}

/* ---------- ranking ---------- */
.ranking{margin-top:var(--gap,1.25rem)}
.ranking__title,.section__title,.title-sm{font:var(--tw,700) 1.12rem var(--fd);letter-spacing:var(--tl,-.02em)}
.hint{color:var(--muted);font-size:.86rem;margin-top:.6rem}
.ranking__list{display:grid;gap:.5rem;margin-top:.8rem}
.ranking__item{display:grid;grid-template-columns:auto 1fr auto auto;gap:.2rem .75rem;align-items:center;padding:.65rem .85rem}
.ranking__position{width:1.9rem;height:1.9rem;border-radius:calc(var(--rs) - 2px);display:grid;place-items:center;font:700 .85rem var(--fd);background:var(--accsoft);color:var(--acc)}
.ranking__name{font-weight:600}
.ranking__score{font:600 .95rem var(--fm)}
.ranking__level{grid-column:2/-1;color:var(--muted);font-size:.78rem;display:flex;align-items:center;gap:.4rem}
.dot{width:.6rem;height:.6rem;border-radius:50%;display:inline-block}
.dot--danger{background:var(--bad)}.dot--warn{background:var(--warn)}.dot--ok{background:var(--ok)}

/* ---------- sección acordeón ---------- */
.section__toggle{width:100%;display:flex;align-items:center;gap:.8rem;background:none;border:0;color:inherit;text-align:left;cursor:pointer;padding:0}
.section__text{display:flex;flex-direction:column;flex:1}
.section__summary{color:var(--muted);font-size:.82rem}
.progress{width:5rem;height:6px;border-radius:9px;background:var(--line);overflow:hidden;flex:none}
.progress i{display:block;height:100%;background:var(--accg,var(--acc));border-radius:inherit}
.chev{width:.6rem;height:.6rem;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-135deg) translate(-2px,-2px);flex:none}
.section__inner{margin-top:1.1rem;display:grid;gap:1rem}

/* ---------- instrucciones ---------- */
.instructions__lead{color:var(--muted)}
.instructions__steps{display:grid;gap:.75rem;counter-reset:s}
.instructions__steps li{counter-increment:s;display:grid;grid-template-columns:1.8rem 1fr;gap:.7rem;align-items:start}
.instructions__steps li::before{content:counter(s);width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;font:700 .78rem var(--fd);background:var(--accsoft);color:var(--acc)}
.instructions__note{padding:.85rem 1rem;color:var(--muted);font-size:.86rem;border:1px dashed var(--line);border-radius:var(--rs)}

/* ---------- stepper (original: área + 3 pasos) ---------- */
.stepper{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem}
.stepper__area{font:700 .72rem var(--fb);text-transform:uppercase;letter-spacing:.12em;color:var(--c)}
.stepper__list{display:flex;gap:.35rem;flex:1;min-width:16rem}
.stepper__item{flex:1}
.stepper__button{width:100%;display:flex;align-items:center;justify-content:center;gap:.45rem;cursor:pointer;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:var(--rs);padding:.5rem .4rem;font:600 .76rem var(--fb);min-height:40px;transition:.2s}
.stepper__button.is-active{color:var(--accink);background:var(--acc);border-color:transparent}
.stepper__button:disabled{opacity:.45;cursor:not-allowed}
.stepper__index{width:1.25rem;height:1.25rem;border-radius:50%;display:grid;place-items:center;font:700 .68rem var(--fb);background:#0002;flex:none}
[data-step="pill"] .stepper__list{padding:.25rem;background:var(--panel2);border:1px solid var(--line);border-radius:999px}
[data-step="pill"] .stepper__button{border:0;background:transparent;border-radius:999px}
[data-step="pill"] .stepper__button.is-active{background:var(--accg,var(--acc))}
[data-step="line"] .stepper__button{background:none;border:0;border-bottom:2px solid var(--line);border-radius:0}
[data-step="line"] .stepper__button.is-active{color:var(--ink);background:none;border-color:var(--acc)}
[data-step="line"] .stepper__index{background:var(--accsoft);color:var(--acc)}
[data-step="dots"] .stepper__button{flex-direction:column;background:none;border:0;gap:.3rem;position:relative}
[data-step="dots"] .stepper__button.is-active{background:none;color:var(--ink)}
[data-step="dots"] .stepper__index{width:1.7rem;height:1.7rem;border:2px solid var(--line);background:var(--panel)}
[data-step="dots"] .is-active .stepper__index{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.stepper__item+.stepper__item [data-x]{display:none}

/* ---------- pregunta (original: meta, texto, hint, escala, nav) ---------- */
.question{display:grid;gap:.9rem}
.question__meta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;color:var(--muted);font-size:.82rem}
.question__badge{font:700 .72rem var(--fb);padding:.2rem .65rem;border-radius:999px;color:var(--accink);background:var(--c)}
.question__count{margin-left:auto;font:600 .8rem var(--fm)}
.question__text{font:var(--tw2,600) clamp(1.15rem,2.6vw,1.45rem)/1.3 var(--fd);letter-spacing:var(--tl,-.02em)}
.question__nav{display:flex;justify-content:space-between;gap:.6rem}
.question__note{font-size:.82rem;color:var(--muted)}
.scale{display:grid;gap:.5rem}
.scale__input{position:absolute;opacity:0;pointer-events:none}
.scale__label{display:flex;align-items:center;gap:.7rem;cursor:pointer;padding:.8rem 1rem;min-height:48px;border-radius:var(--rs);background:var(--panel2);border:1px solid var(--line);transition:.2s;font-weight:500}
.scale__label::before{content:"";width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid var(--muted);flex:none;transition:.2s}
.scale__label:hover{border-color:var(--acc)}
.scale__input:checked+.scale__label{border-color:var(--acc);background:var(--accsoft);color:var(--ink);font-weight:600}
.scale__input:checked+.scale__label::before{border-color:var(--acc);background:radial-gradient(var(--acc) 42%,transparent 46%)}
.scale__input:focus-visible+.scale__label{outline:2px solid var(--acc);outline-offset:2px}
[data-fx="soft"] .scale__label{border:0;box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);background:var(--panel)}
[data-fx="soft"] .scale__input:checked+.scale__label{box-shadow:inset 3px 3px 8px var(--lo),inset -3px -3px 8px var(--hi);background:var(--panel);color:var(--acc)}
[data-fx="brut"] .scale__label{border:2px solid var(--ink);background:var(--panel)}
[data-fx="brut"] .scale__input:checked+.scale__label{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
[data-opt="list"] .scale{gap:0}
[data-opt="list"] .scale__label{background:none;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none!important;padding-inline:.2rem}
[data-opt="list"] .scale__label:last-of-type{border-bottom:1px solid var(--line)}
[data-opt="list"] .scale__input:checked+.scale__label{background:none;box-shadow:inset 3px 0 0 var(--acc)!important;padding-left:.8rem;color:var(--acc)}
[data-opt="pills"] .scale{display:flex;flex-wrap:wrap}
[data-opt="pills"] .scale__label{border-radius:999px;padding:.55rem 1.1rem}
[data-opt="pills"] .scale__label::before{display:none}
[data-opt="segmented"] .scale{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;background:var(--panel2)}
[data-opt="segmented"] .scale__label{flex:1;justify-content:center;border:0;border-radius:0;background:none;box-shadow:none!important;padding:.8rem .3rem;text-align:center;font-size:.85rem;border-right:1px solid var(--line)}
[data-opt="segmented"] .scale__label::before{display:none}
[data-opt="segmented"] .scale__input:checked+.scale__label{background:var(--acc);color:var(--accink)}
[data-opt="grid"] .scale{grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr))}
[data-opt="grid"] .scale__label{flex-direction:column;justify-content:center;text-align:center;padding:1rem .4rem;min-height:5rem;gap:.5rem}
@media(max-width:560px){[data-opt="segmented"] .scale{flex-direction:column}[data-opt="segmented"] .scale__label{border-right:0;border-bottom:1px solid var(--line)}}

/* ---------- resultado (original: scores, dimensiones) ---------- */
.result{display:grid;gap:1rem}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.score{padding:.8rem;text-align:center}
.score .l{display:block;color:var(--muted);font-size:.74rem}
.score .v{font:700 1.45rem var(--fd);letter-spacing:-.02em}
.level{font-weight:700;color:var(--warn)}
.band{padding:.9rem 1rem;border-left:3px solid var(--c);background:var(--panel2);border-radius:0 var(--rs) var(--rs) 0}
.sub{font:700 .78rem var(--fb);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.dims{display:grid;gap:.5rem}
.dims li{padding:.7rem .9rem;display:grid;gap:.15rem}
.dims li strong{display:flex;justify-content:space-between;gap:1rem}
.dims li span{color:var(--muted);font-size:.8rem}
.meter{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:.3rem}
.meter i{display:block;height:100%;background:var(--c);border-radius:inherit}

/* ---------- barra de demo ---------- */
.demo{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;display:flex;gap:.3rem;align-items:center;padding:.3rem;border-radius:999px;background:#0d0f14;color:#dfe3ee;box-shadow:0 12px 40px #0008;font:600 12.5px system-ui;max-width:calc(100% - 16px)}
.demo button{font:inherit;color:#c5cad8;background:none;border:0;border-radius:999px;padding:.5rem .8rem;cursor:pointer;white-space:nowrap}
.demo button:hover{background:#ffffff14}
.demo button[aria-pressed=true]{background:#fff;color:#0d0f14}
.demo .name{padding:0 .5rem;min-width:11rem;text-align:center;cursor:pointer;color:#fff}
.demo .sep{width:1px;height:18px;background:#ffffff26;margin:0 .2rem}
@media(max-width:700px){.demo .views{display:none}.demo .name{min-width:8rem}}
.picker{position:fixed;inset:0;z-index:60;background:#0b0d12e6;backdrop-filter:blur(10px);display:none;overflow:auto;padding:2rem 1rem 6rem}
.picker.on{display:block}
.picker h2{color:#fff;font:700 1.1rem system-ui;max-width:72rem;margin:0 auto 1rem}
.pgrid{max-width:72rem;margin:auto;display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr))}
.pc{cursor:pointer;border:2px solid transparent;border-radius:14px;overflow:hidden;background:#161922;color:#e8ebf4;text-align:left;padding:0;font:600 12.5px system-ui}
.pc[aria-current=true]{border-color:#fff}
.pc .sw{height:54px;display:flex}.pc .sw i{flex:1}
.pc .tx{padding:.5rem .65rem}.pc small{display:block;color:#8d93a6;font-weight:500;margin-top:.1rem}
.fam{grid-column:1/-1;color:#8d93a6;font:700 11px system-ui;text-transform:uppercase;letter-spacing:.12em;margin-top:.8rem}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div id="root"></div>

<div class="demo" role="group" aria-label="Controles de demo">
  <button id="prev" aria-label="Tema anterior">←</button>
  <button class="name" id="name" aria-label="Ver todos los temas">—</button>
  <button id="next" aria-label="Tema siguiente">→</button>
  <span class="sep views"></span>
  <span class="views" id="views"></span>
</div>
<div class="picker" id="picker"><h2>21 propuestas · pulsa para aplicar (←/→ cambia de tema, Esc cierra)</h2><div class="pgrid" id="pgrid"></div></div>

<script>

const pt=(r,a)=>[60+r*Math.sin(a),60-r*Math.cos(a)];

function palette(t){
  if(t.pal==="mono")return Array.from({length:8},(_,i)=>`color-mix(in srgb,var(--acc) ${100-i*8}%,var(--bg))`);
  return PAL[t.pal];
}
function applyTheme(i){
  ti=(i+T.length)%T.length;const t=T[ti],b=document.body;
  b.removeAttribute("style");
  const defaults={fm:"JetBrains Mono",rb:"999px",tl:"-.03em",tw:700,tw2:600,gap:"1.25rem",blur:"20px",sh:"none",hi:"#fff",lo:"#ccc",glow:"#0000"};
  const v={...defaults,...t.v};
  const set=(k,val)=>b.style.setProperty("--"+k,val);
  for(const k in v){if(["fd","fb","fm"].includes(k))set(k,`"${v[k]}",system-ui,sans-serif`);else if(k==="bgsize")b.style.backgroundSize=v[k];else set(k,v[k])}
  set("accsoft",`color-mix(in srgb,var(--acc) 15%,transparent)`);
  if(!v.accg)set("accg","var(--acc)");
  if(t.glow)set("glow","color-mix(in srgb,var(--acc) 35%,transparent)");
  palette(t).forEach((c,k)=>set("a"+(k+1),c));
  Object.assign(b.dataset,{layout:t.layout,wheel:t.wheel,opt:t.opt,head:t.head,step:t.step,fx:t.fx,dark:t.dark?1:0,grad:t.grad?1:0,glow:t.glow?1:0});
  b.dataset.theme=t.id;
  $("#name").textContent=`${ti+1}/${T.length} · ${t.n}`;
  document.title=`Galería · ${t.n}`;
  try{localStorage.gal=t.id}catch{}
  history.replaceState(null,"","#"+t.id+(view!=="landing"?"/"+view:""));
  render();
}

function rankingHTML(scores){
  const rows=scores.map((s,i)=>({s,i})).filter(x=>x.s!=null).sort((a,b)=>a.s-b.s);
  return `<section class="ranking" aria-label="Ranking sugerido de prioridad"><div class="panel"><h2 class="ranking__title">Ranking sugerido</h2>`+(rows.length?`<ol class="ranking__list">${rows.map((r,k)=>{const[l,tone]=LEVEL(r.s);return `<li class="ranking__item inset" style="--c:var(--a${r.i+1})"><span class="ranking__position" aria-hidden="true">${k+1}</span><span class="ranking__name">${NAMES[r.i]}</span><span class="dot dot--${tone}" title="${l}"></span><span class="ranking__score">${fmt(r.s)}/10</span><span class="ranking__level">${l}</span></li>`}).join("")}</ol>`:`<p class="hint">Completa un área para ver su prioridad sugerida.</p>`)+`</div></section>`;
}

const stepper=(active,complete)=>`<nav class="stepper" aria-label="Pasos de Salud" style="--c:var(--a1)"><span class="stepper__area">Salud</span><ol class="stepper__list">${["Evaluación inicial","Cuestionario","Resultado"].map((l,i)=>`<li class="stepper__item"><button class="stepper__button${i===active?" is-active":""}" ${i===active?'aria-current="step"':""} ${i===2&&!complete?"disabled":""}><span class="stepper__index">${i+1}</span><span class="stepper__label">${l}</span></button></li>`).join("")}</ol></nav>`;

const INSTR=`<article class="instructions"><p class="instructions__lead">La rueda resume ocho áreas de tu vida. Cada área tiene su propio cuestionario y puedes hacerlas en el orden que prefieras.</p><ol class="instructions__steps">
<li><span><strong>Elige un área en la rueda.</strong> Pulsa su nombre —Salud, Emocional, Relaciones, Familia, Trabajo, Finanzas, Crecimiento u Ocio— para abrir su cuestionario.</span></li>
<li><span><strong>Puntúa tu percepción (0–10).</strong> Antes de las preguntas, marca cómo crees que está esa área hoy; después se compara con el resultado.</span></li>
<li><span><strong>Responde sus 28 preguntas.</strong> 22 puntuables, 1 de prioridad y 4 de contexto. Las de contexto no puntúan: matizan la lectura.</span></li>
<li><span><strong>Lee el resultado del área.</strong> Verás percepción frente a resultado, la brecha, tus cuatro dimensiones, las señales transversales y el primer foco. Puedes volver a cualquier paso cuando quieras.</span></li></ol>
<p class="instructions__note">La nota de un área aparece en la rueda cuando completas sus 22 preguntas puntuables; hasta entonces, los parciales son orientativos. Puedes dejar un área a medias y volver más tarde: el ranking bajo la rueda sugiere por dónde empezar.</p></article>`;

const QUIZ=`${""}<article class="question" style="--c:var(--a1)">
<p class="question__meta"><span class="question__badge">Salud</span><span>Hábitos</span><span class="question__count">2/27</span></p>
<h3 class="question__text">Reservo un tiempo de sueño y descanso acorde con mis necesidades.</h3>
<p class="hint" style="margin:0">Piensa en las últimas semanas y en tus posibilidades actuales. Este bloque recoge tu experiencia de cuidado y bienestar físico.</p>
<div class="scale scale--choices" role="radiogroup" aria-label="Reservo un tiempo de sueño y descanso acorde con mis necesidades.">${FREQ.map((l,i)=>`<input class="scale__input" type="radio" id="o${i}" name="q" ${i===3?"checked":""}><label class="scale__label" for="o${i}">${l}</label>`).join("")}</div>
<nav class="question__nav"><button class="btn">Anterior</button><button class="btn btn--primary">Siguiente</button></nav></article>`;

const RESULT=`<article class="result" style="--c:var(--a1)"><h3 class="title-sm">Resultado de Salud</h3>
<p class="band"><strong>El área de Salud tiene margen de mejora.</strong> La lectura reúne hábitos, energía, cuidado preventivo y relación con el cuerpo. Describe tu experiencia actual de cuidado.</p>
<h4 class="sub">Tus dimensiones</h4><ul class="dims">${[["Hábitos",7.1,"Estable"],["Energía y vitalidad",5.4,"Necesita atención"],["Cuidado preventivo",6.8,"Área de mejora"],["Relación con el cuerpo",6.3,"Área de mejora"]].map(([n,s,l])=>`<li class="inset"><strong><span style="color:var(--ink);font-size:.95rem">${n}</span><span style="font-family:var(--fm)">${fmt(s)}/10</span></strong><span>${l}</span><div class="meter"><i style="width:${s*10}%"></i></div></li>`).join("")}</ul>
<h4 class="sub">Percepción vs resultado</h4>
<div class="scores"><div class="score inset"><span class="l">Tu percepción</span><span class="v">8/10</span></div><div class="score inset"><span class="l">Resultado</span><span class="v">6,4/10</span></div><div class="score inset"><span class="l">Brecha</span><span class="v">−1,6</span></div></div>
<p class="level">Área de mejora</p><p class="hint" style="margin:0">Tu percepción de Salud es algo más alta que el resultado del cuestionario.</p>
<button class="btn" style="justify-self:start">Volver a la rueda</button></article>`;

function render(){
  const t=T[ti],scores=SCORES[view],done=scores.filter(s=>s!=null).length;
  const landing=view==="landing";
  const stack=`<div class="panel"><h2 class="section__head" style="margin:0"><button class="section__toggle" aria-expanded="true"><span class="section__text"><span class="section__title">${landing?"Cómo usar la rueda":"Cuestionario"}</span><span class="section__summary">${landing?"Selecciona un área en la rueda":(view==="quiz"?"58 de 224 respondidas":"192 de 224 respondidas")}</span></span>${landing?"":`<span class="progress" role="progressbar" aria-valuenow="${view==="quiz"?26:86}"><i style="width:${view==="quiz"?26:86}%"></i></span>`}<span class="chev" aria-hidden="true"></span></button></h2><div class="section__inner">${landing?INSTR:stepper(view==="quiz"?1:2,view==="result")+(view==="quiz"?QUIZ:RESULT)}</div></div>`;
  root.innerHTML=`<div class="app">
  <header class="head"><div class="head__row"><div><h1 class="title">Rueda de la Vida</h1><p class="subtitle">Medir · Comparar · Priorizar · Actuar</p></div>
    <div class="actions"><button class="btn">Editar preguntas</button><button class="btn">Exportar progreso</button><button class="btn">Importar progreso</button><button class="btn">Reiniciar</button></div></div>
    <div class="transfer"><p>El archivo JSON contiene tus respuestas y no está cifrado. Guárdalo en un lugar privado; esta página no guarda el progreso automáticamente.</p><p role="status" aria-live="polite"></p></div></header>
  <aside class="side"><div class="panel"><div class="side__brand">Rueda de la Vida</div><div class="side__h">Áreas</div><div id="sidenav"></div><div class="side__h" style="margin-top:.8rem">Datos</div><button class="nav-i">Exportar progreso</button><button class="nav-i">Importar progreso</button></div></aside>
  <div class="wheelcol"><div class="panel" id="wheelpanel"></div>${rankingHTML(scores)}</div>
  <div class="stack">${stack}</div></div>`;
  $("#wheelpanel").append(wheelSVG(scores));
  render.side=()=>{$("#sidenav").innerHTML=NAMES.map((n,i)=>`<button class="nav-i${selArea===i?" on":""}" style="--c:var(--a${i+1})"><i></i>${n}<span>${scores[i]==null?"—":fmt(scores[i])}</span></button>`).join("")};
  render.side();
}

/* ============================ CONTROLES ============================ */
$("#prev").onclick=()=>applyTheme(ti-1);$("#next").onclick=()=>applyTheme(ti+1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")applyTheme(ti+1);if(e.key==="ArrowLeft")applyTheme(ti-1);if(e.key==="Escape")$("#picker").classList.remove("on")});
$("#views").innerHTML=[["landing","Inicio"],["quiz","Pregunta"],["result","Resultado"]].map(([k,l])=>`<button data-v="${k}" aria-pressed="${k==="landing"}">${l}</button>`).join("");
$("#views").onclick=e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;[...$("#views").children].forEach(x=>x.setAttribute("aria-pressed",x===b));applyTheme(ti)};
$("#name").onclick=()=>$("#picker").classList.add("on");
$("#picker").onclick=e=>{if(e.target.id==="picker")$("#picker").classList.remove("on")};
let lastF="";$("#pgrid").innerHTML=T.map((t,i)=>{let h="";if(t.f!==lastF){h=`<div class="fam">${t.f}</div>`;lastF=t.f}
  return h+`<button class="pc" data-i="${i}"><div class="sw"><i style="background:${t.v.bg}"></i><i style="background:${t.v.panel2}"></i><i style="background:${t.v.acc}"></i><i style="background:${t.v.ink}"></i></div><div class="tx">${i+1}. ${t.n}<small>${t.d}</small></div></button>`}).join("");
$("#pgrid").onclick=e=>{const b=e.target.closest(".pc");if(!b)return;$("#picker").classList.remove("on");applyTheme(+b.dataset.i)};

(function init(){
  const h=location.hash.slice(1).split("/");let i=T.findIndex(t=>t.id===h[0]);
  if(h[1]&&SCORES[h[1]]){view=h[1];[...$("#views").children].forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===view))}
  if(i<0){try{i=T.findIndex(t=>t.id===localStorage.gal)}catch{}}
  applyTheme(i<0?0:i);
})();
</script>
</body>
</html>
